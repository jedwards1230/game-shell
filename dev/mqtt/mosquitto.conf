# Minimal test-only Mosquitto config for the tv-shell MQTT harness.
#
# NOT a deployment config. Anonymous access and a wide-open listener are fine
# here because this broker is ephemeral, bound to a throwaway container, and
# holds nothing but test fixtures. The real broker's ACL is the security
# boundary for the command surface (see docs/MQTT.md) — never copy this file
# onto anything reachable.
#
# `listener` is load-bearing: Mosquitto 2.x with NO listener line binds to
# 127.0.0.1 *inside the container*, which a published port can never reach.
listener 1883 0.0.0.0
allow_anonymous true

# No persistence: every `compose up` must start from an empty retained set.
# A leftover retained discovery/state message from a previous run would make a
# publisher that publishes NOTHING look like a publisher that worked.
persistence false
