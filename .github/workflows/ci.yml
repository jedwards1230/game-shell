# CI orchestrator — the single source of truth for required status checks.
#
# THE PROBLEM this solves: a path-filtered workflow (on.pull_request.paths) only
# *triggers* when those paths change, so it can't be a required check — a PR that
# doesn't touch those paths would leave the check "waiting for status" forever and
# never be mergeable. See https://docs.github.com/actions for the gory details.
#
# THE PATTERN: this workflow has NO top-level `paths:` filter, so it runs on every
# PR and always reports. A `changes` job (dorny/paths-filter) detects which areas
# changed; each area is a reusable workflow called only when its area changed; and
# a final `ci-gate` job aggregates the results. Mark ONLY `CI / ci-gate` as the
# required status check in branch protection / rulesets — it always runs, and it
# treats skipped area jobs as success, so unrelated PRs pass cleanly.
#
# Area workflows (rust.yml / host.yml / qml-test.yml / lint.yml) are reusable
# (`on: workflow_call`); they keep their own focused logic + docs and are only
# invoked from here. Release workflows (release-*.yml) are tag-triggered and live
# outside this orchestrator.

name: CI

run-name: "CI — ${{ github.event_name }} on ${{ github.ref_name }} by @${{ github.actor }}"

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Detect which areas changed so each reusable workflow runs only when relevant.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      host: ${{ steps.filter.outputs.host }}
      qml: ${{ steps.filter.outputs.qml }}
      qmlformat: ${{ steps.filter.outputs.qmlformat }}
      widgets: ${{ steps.filter.outputs.widgets }}
      mqtt: ${{ steps.filter.outputs.mqtt }}
      gamescope: ${{ steps.filter.outputs.gamescope }}
      shellv2: ${{ steps.filter.outputs.shellv2 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          # A change to the orchestrator itself re-runs every area (the leading
          # '.github/workflows/ci.yml' line in each filter), so CI changes are
          # always exercised.
          filters: |
            rust:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'daemon/**'
              - 'panel/**'
              - 'protocol/**'
              - 'core/**'
              # The v2 installer and its reference session entry are inputs to
              # the core crate's install tests (they run install-v2.sh and read
              # config/tv-shell-v2.desktop), and the installer is shellchecked by
              # the `core` job. A change to either that did not run this area
              # would go unchecked.
              - 'scripts/install-v2.sh'
              - 'config/tv-shell-v2.desktop'
              # v1's installer is shellchecked by the `core` job too. Nothing
              # else lints it, so a change to it that skipped this area would be
              # unchecked — and v1 is what still boots the couch on a rollback.
              - 'scripts/install.sh'
              - '.github/workflows/rust.yml'
              - '.github/workflows/ci.yml'
            host:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'host/**'
              - 'protocol/**'
              - '.github/workflows/host.yml'
              - '.github/workflows/ci.yml'
            qml:
              - 'shell/**/*.qml'
              - 'shell/**/qmldir'
              - 'tests/qml/**'
              - '.github/workflows/qml-test.yml'
              - '.github/workflows/ci.yml'
            qmlformat:
              - '**/*.qml'
              - '.qmllint.ini'
              - '.github/workflows/lint.yml'
              - '.github/workflows/ci.yml'
            widgets:
              - 'widgets-index.json'
              - 'shell/widgets/lib/WidgetManifests.qml'
              - 'scripts/check-widgets-index.py'
              - '.github/workflows/widgets.yml'
              - '.github/workflows/ci.yml'
            # The broker-backed MQTT tests exercise the host binary against a
            # real mosquitto, so they track the host crate, the shared protocol
            # crate (which owns every topic/discovery builder), and the harness
            # itself. Slow by nature — they wait out heartbeat and Last-Will
            # timers — so they stay their own area rather than riding along in
            # host.yml's 3-OS matrix.
            mqtt:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'host/**'
              - 'protocol/**'
              - 'dev/mqtt/**'
              - 'scripts/mqtt-smoke-test.sh'
              - '.github/workflows/mqtt.yml'
              - '.github/workflows/ci.yml'
            # The v2 shell. Unlike v1's `qml` area this one BUILDS — CMake, C++
            # and a real X server for the pre-map tagging assertion — so it is
            # its own area rather than a lane inside qml-test.yml.
            shellv2:
              - 'shell-v2/**'
              - '.github/workflows/shell-v2.yml'
              - '.github/workflows/ci.yml'
            # The gamescope kit's shell logic, exercised against a fake X
            # display by dev/gamescope/tests/. Pure shell on a stock runner —
            # no gamescope, no Steam, no network.
            gamescope:
              - 'dev/gamescope/**'
              - '.github/workflows/gamescope.yml'
              - '.github/workflows/ci.yml'

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    uses: ./.github/workflows/rust.yml

  host:
    needs: changes
    if: needs.changes.outputs.host == 'true'
    uses: ./.github/workflows/host.yml

  qml:
    needs: changes
    if: needs.changes.outputs.qml == 'true'
    uses: ./.github/workflows/qml-test.yml

  qmlformat:
    needs: changes
    if: needs.changes.outputs.qmlformat == 'true'
    # The auto-format push needs write + secrets; reusable workflows take the
    # caller job's permissions/secrets.
    permissions:
      contents: write
    secrets: inherit
    uses: ./.github/workflows/lint.yml

  widgets:
    needs: changes
    if: needs.changes.outputs.widgets == 'true'
    uses: ./.github/workflows/widgets.yml

  mqtt:
    needs: changes
    if: needs.changes.outputs.mqtt == 'true'
    uses: ./.github/workflows/mqtt.yml

  gamescope:
    needs: changes
    if: needs.changes.outputs.gamescope == 'true'
    uses: ./.github/workflows/gamescope.yml

  shellv2:
    needs: changes
    if: needs.changes.outputs.shellv2 == 'true'
    uses: ./.github/workflows/shell-v2.yml

  # Deliberately unconditional — no `needs: changes`, no filter. This one scans
  # the whole tree in about a second, and site identity can be reintroduced from
  # any source path, so skipping it on an "unrelated" PR is exactly how it came
  # back three times (docs/PRD.md §11).
  site-identity:
    uses: ./.github/workflows/site-identity.yml

  # The ONLY required check. Always runs; fails if any area job failed/was
  # cancelled. Skipped area jobs (their area didn't change) count as success.
  ci-gate:
    needs: [changes, rust, host, qml, qmlformat, widgets, mqtt, gamescope, shellv2, site-identity]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify no required job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "A required CI job failed or was cancelled:"
          echo "  changes=${{ needs.changes.result }}"
          echo "  rust=${{ needs.rust.result }}"
          echo "  host=${{ needs.host.result }}"
          echo "  qml=${{ needs.qml.result }}"
          echo "  qmlformat=${{ needs.qmlformat.result }}"
          echo "  widgets=${{ needs.widgets.result }}"
          echo "  mqtt=${{ needs.mqtt.result }}"
          echo "  gamescope=${{ needs.gamescope.result }}"
          echo "  shellv2=${{ needs.shellv2.result }}"
          echo "  site-identity=${{ needs['site-identity'].result }}"
          exit 1
      - name: All required jobs passed or were skipped
        run: echo "CI gate green."
