# Headless QML unit tests (QtQuickTest) for the shell's components.
#
# Runs the stock Qt `qmltestrunner` under QT_QPA_PLATFORM=offscreen — no
# Quickshell, no compositor, no GPU needed. Exercises real Quickshell-free
# components (QuickActions, …) against stub singletons; see tests/qml/README.md.
#
# Invoked by the CI orchestrator (.github/workflows/ci.yml), which decides via
# path-based change detection whether the shell QML / test harness changed, so
# unrelated PRs never reach this workflow. ci.yml is the single required-check
# surface.

name: QML Test

run-name: "QML Test — ${{ github.event_name }} on ${{ github.ref_name }} by @${{ github.actor }}"

on:
  workflow_call:

permissions:
  contents: read

jobs:
  qmltest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Qt 6.8.3
        # NOT jurplel/install-qt-action. This repo enforces `sha_pinning_required`
        # on Actions, and that check applies to TRANSITIVE action references: the
        # action's own composite calls `actions/setup-python@v6` and
        # `jurplel/install-qt-action/action@v4` unpinned, so pinning our own
        # `uses:` to a SHA is not sufficient and every QML job was rejected before
        # running a single step:
        #
        #   The actions actions/setup-python@v6 and jurplel/install-qt-action/action@v4
        #   are not allowed in jedwards1230/tv-shell because all actions must be
        #   pinned to a full-length commit SHA.
        #
        # With `allowed_actions: all` there is no allow-list/exemption to grant
        # (the selected-actions API 409s), so the action is simply unusable here.
        # Installing Qt through plain `run:` steps sidesteps the policy entirely —
        # no action is involved, nothing to pin — while keeping the EXACT Qt
        # version the gates are calibrated to (.qmllint.ini severities + qmlformat
        # output both drift between Qt releases, so this must not float to
        # whatever apt ships).
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libglib2.0-0t64 libgl1 libegl1 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libfontconfig1 libfreetype6 libgssapi-krb5-2 \
            libharfbuzz0b libpng16-16 libmd4c0
          python3 -m pip install --break-system-packages --quiet 'aqtinstall==3.2.1'
          aqt install-qt linux desktop "$QT_VERSION" linux_gcc_64 \
            --outputdir "$RUNNER_TEMP/Qt"
          echo "$RUNNER_TEMP/Qt/$QT_VERSION/gcc_64/bin" >> "$GITHUB_PATH"
        env:
          QT_VERSION: "6.8.3"

      - name: Run QML tests (offscreen)
        run: ./tests/qml/run.sh
