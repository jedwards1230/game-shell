# Per-binary release workflow for the cross-platform host sidecar (host/).
#
# Opt-in via a `semver:host:*` label on the merged PR (or a manual
# `workflow_dispatch`). Version compute, tagging, and AI release notes are
# delegated to the shared `ai-release.yml@v1` reusable; this workflow then builds
# `tv-shell-host` for Linux (static musl), macOS (arm64 + x86_64), and Windows,
# and publishes ONE GitHub Release at the tag carrying every binary plus a
# `checksums.txt`. The Ansible `desktop-common` role fetches the musl binary by
# this tag (`install_method: fetch`) instead of building it on-host.
#
# The host crate is pure Rust (tokio/axum/serde/subtle/keyvalues-parser — no
# evdev/cec/zbus, no C deps), so every target cross-compiles with nothing but the
# musl gcc wrapper on the Linux leg. The daemon (tv-shell-input) has its own
# release-input.yml; this workflow is `-p tv-shell-host`-scoped and never builds
# the daemon's Linux-only graph.
#
# Tag scheme (see CLAUDE.md › CI): `host-v<semver>` releases the host;
# `input-v<semver>` releases the daemon. Per-binary tags keep the two artifacts
# independently versioned within the one monorepo — the reusable is called with
# `tag_prefix: host-`, so it only ever reads and writes `host-v*` tags and the
# next version is computed from the `host-v*` series alone.
#
# NOTE: releases are no longer cut by pushing a `host-v*` tag by hand. Merge a PR
# labelled `semver:host:patch|minor|major`, or run this workflow manually.

name: Release Host

run-name: >-
  ${{
    github.event_name == 'workflow_dispatch'
      && format('Release Host: {0}{1}', inputs.dry_run && 'dry-run ' || '', inputs.bump_type)
      || format('Release Host: {0}', github.event.head_commit.message || github.sha)
  }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump type"
        required: true
        type: choice
        options: [patch, minor, major]
        default: patch
      dry_run:
        description: "Compute version + preview notes without tagging or publishing"
        required: false
        type: boolean
        default: false

concurrency:
  group: release-host
  cancel-in-progress: false

# ai-release.yml@v1 reads merged PRs for the changelog and the detect job runs
# `gh pr list` — both need pull-requests:read. A restricted permissions block
# defaults every unlisted scope to none, so grant it explicitly.
permissions:
  contents: write
  pull-requests: read

jobs:
  detect:
    name: Detect bump type
    runs-on: ubuntu-latest
    outputs:
      bump_type: ${{ steps.bump.outputs.type }}
      release: ${{ steps.bump.outputs.release }}
      dry_run: ${{ steps.bump.outputs.dry_run }}
    steps:
      - name: Determine bump type
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TYPE="${{ inputs.bump_type }}"; RELEASE="true"; DRY="${{ inputs.dry_run }}"
          else
            # push event: opt-in via the merged PR's semver:host:* label. The label is
            # component-scoped because this monorepo versions host and input
            # independently — a `semver:input:*` label must not cut a host release.
            # No matching label -> no release.
            # Retry -- the GitHub API may not have the merge commit indexed yet.
            LABELS=""
            for attempt in 1 2 3; do
              LABELS=$(gh pr list --state merged --base main --limit 100 \
                --json labels,mergeCommit \
                | jq -r --arg sha "$GITHUB_SHA" \
                  '.[] | select(.mergeCommit.oid == $sha) | .labels[].name' 2>/dev/null || echo "")
              [ -n "$LABELS" ] && break
              echo "Attempt ${attempt}: no labels for ${GITHUB_SHA}, retrying in 5s..."
              sleep 5
            done
            echo "Labels: ${LABELS:-<none>}"
            DRY="false"
            if echo "$LABELS" | grep -q 'semver:host:major'; then
              TYPE="major"; RELEASE="true"
            elif echo "$LABELS" | grep -q 'semver:host:minor'; then
              TYPE="minor"; RELEASE="true"
            elif echo "$LABELS" | grep -q 'semver:host:patch'; then
              TYPE="patch"; RELEASE="true"
            else
              echo "::notice::No semver:host:* label -- skipping host release."
              TYPE="none"; RELEASE="false"
            fi
          fi
          { echo "type=$TYPE"; echo "release=$RELEASE"; echo "dry_run=$DRY"; } >> "$GITHUB_OUTPUT"

  prepare:
    name: Tag & Generate Notes
    needs: [detect]
    if: needs.detect.outputs.release == 'true'
    uses: jedwards1230/release-workflows/.github/workflows/ai-release.yml@v1
    with:
      service_name: tv-shell-host
      service_description: "the cross-platform host sidecar for tv-shell — a Rust Steam library/launch backend the TV shell's daemon calls over HTTP"
      bump_type: ${{ needs.detect.outputs.bump_type }}
      tag_prefix: host-
      create_release: false
      dry_run: ${{ needs.detect.outputs.dry_run == 'true' }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  build:
    name: ${{ matrix.target }}
    needs: [detect, prepare]
    if: needs.detect.outputs.release == 'true' && needs.detect.outputs.dry_run != 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: tv-shell-host-x86_64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: tv-shell-host-aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: tv-shell-host-x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: tv-shell-host-x86_64-pc-windows-msvc.exe
    steps:
      # The tag the reusable just created is the source of truth for the released
      # version — build from it, never from the branch head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}

      # musl static link needs the musl gcc wrapper; the pure-Rust host needs no
      # other system deps on any target (incl. the cross-arch darwin leg).
      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: .
          key: release-host-${{ matrix.target }}

      - name: Build
        run: cargo build --release -p tv-shell-host --target ${{ matrix.target }}

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            cp "target/${{ matrix.target }}/release/tv-shell-host.exe" "dist/${{ matrix.asset }}"
          else
            cp "target/${{ matrix.target }}/release/tv-shell-host" "dist/${{ matrix.asset }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish Release
    needs: [detect, prepare, build]
    if: needs.detect.outputs.release == 'true' && needs.detect.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true

      # sha256 over the staged binaries; the Ansible role pins the musl line from
      # this file to verify the fetched artifact before installing it as root.
      - name: Generate checksums
        working-directory: dist
        run: sha256sum tv-shell-host-* | tee checksums.txt

      # The reusable base64-encodes the body so it survives GitHub Actions' job
      # output character restrictions — decode before handing it to the release.
      - name: Decode release notes
        env:
          RELEASE_BODY: ${{ needs.prepare.outputs.release_body }}
        run: printf '%s' "$RELEASE_BODY" | base64 -d > body.md

      - name: Publish release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          body_path: body.md
          files: dist/*
          fail_on_unmatched_files: true

      - name: Summary
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          BUMP: ${{ needs.detect.outputs.bump_type }}
        run: |
          {
            echo "## Release Host"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Tag | \`${TAG}\` |"
            echo "| Bump | ${BUMP} |"
            echo "| Artifacts | 4 binaries + checksums.txt |"
            echo
            echo "[View release](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG})"
          } >> "$GITHUB_STEP_SUMMARY"
