# Per-binary release workflow for the cross-platform host sidecar (host/).
#
# Opt-in via a `semver:host:*` label on the merged PR (or a manual
# `workflow_dispatch`). Version compute, tagging, and AI release notes are
# delegated to the shared `ai-release.yml@v1` reusable; this workflow then builds
# `tv-shell-host` for Linux (static musl), macOS (arm64 + x86_64), and Windows,
# and publishes ONE GitHub Release at the tag carrying every binary plus a
# `checksums.txt`. The Ansible `desktop-common` role fetches the musl binary by
# this tag (`install_method: fetch`) instead of building it on-host.
#
# The host crate is pure Rust (tokio/axum/serde/subtle/keyvalues-parser — no
# evdev/cec/zbus, no C deps), so every target cross-compiles with nothing but the
# musl gcc wrapper on the Linux leg. The daemon (tv-shell-input) has its own
# release-input.yml; this workflow is `-p tv-shell-host`-scoped and never builds
# the daemon's Linux-only graph.
#
# Tag scheme (see CLAUDE.md › CI): `host-v<semver>` releases the host;
# `input-v<semver>` releases the daemon. Per-binary tags keep the two artifacts
# independently versioned within the one monorepo — the reusable is called with
# `tag_prefix: host-`, so it only ever reads and writes `host-v*` tags and the
# next version is computed from the `host-v*` series alone.
#
# The build job STAMPS the computed tag version into `host/Cargo.toml` before
# `cargo build`, so the released binary's `CARGO_PKG_VERSION` is the real release
# version rather than the in-repo floor, and verifies the stamp landed.
#
# NOTE: releases are no longer cut by pushing a `host-v*` tag by hand. Merge a PR
# labelled `semver:host:patch|minor|major`, or run this workflow manually.

name: Release Host

run-name: >-
  ${{
    github.event_name == 'workflow_dispatch'
      && format('Release Host: {0}{1}', inputs.dry_run && 'dry-run ' || '', inputs.bump_type)
      || format('Release Host: {0}', github.event.head_commit.message || github.sha)
  }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump type"
        required: true
        type: choice
        options: [patch, minor, major]
        default: patch
      dry_run:
        description: "Compute version + preview notes without tagging or publishing"
        required: false
        type: boolean
        default: false

concurrency:
  group: release-host
  cancel-in-progress: false

# ai-release.yml@v1 reads merged PRs for the changelog and the detect job runs
# `gh pr list` — both need pull-requests:read. A restricted permissions block
# defaults every unlisted scope to none, so grant it explicitly.
permissions:
  contents: write
  pull-requests: read

jobs:
  detect:
    name: Detect bump type
    runs-on: ubuntu-latest
    outputs:
      bump_type: ${{ steps.bump.outputs.type }}
      release: ${{ steps.bump.outputs.release }}
      dry_run: ${{ steps.bump.outputs.dry_run }}
    steps:
      - name: Determine bump type
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TYPE="${{ inputs.bump_type }}"; RELEASE="true"; DRY="${{ inputs.dry_run }}"
          else
            # push event: opt-in via the merged PR's semver:host:* label. The label is
            # component-scoped because this monorepo versions host and input
            # independently — a `semver:input:*` label must not cut a host release.
            # No matching label -> no release.
            # Retry -- the GitHub API may not have the merge commit indexed yet.
            LABELS=""
            for attempt in 1 2 3; do
              LABELS=$(gh pr list --state merged --base main --limit 100 \
                --json labels,mergeCommit \
                | jq -r --arg sha "$GITHUB_SHA" \
                  '.[] | select(.mergeCommit.oid == $sha) | .labels[].name' 2>/dev/null || echo "")
              [ -n "$LABELS" ] && break
              echo "Attempt ${attempt}: no labels for ${GITHUB_SHA}, retrying in 5s..."
              sleep 5
            done
            echo "Labels: ${LABELS:-<none>}"
            DRY="false"
            if echo "$LABELS" | grep -q 'semver:host:major'; then
              TYPE="major"; RELEASE="true"
            elif echo "$LABELS" | grep -q 'semver:host:minor'; then
              TYPE="minor"; RELEASE="true"
            elif echo "$LABELS" | grep -q 'semver:host:patch'; then
              TYPE="patch"; RELEASE="true"
            else
              echo "::notice::No semver:host:* label -- skipping host release."
              TYPE="none"; RELEASE="false"
            fi
          fi
          { echo "type=$TYPE"; echo "release=$RELEASE"; echo "dry_run=$DRY"; } >> "$GITHUB_OUTPUT"

  prepare:
    name: Tag & Generate Notes
    needs: [detect]
    if: needs.detect.outputs.release == 'true'
    uses: jedwards1230/release-workflows/.github/workflows/ai-release.yml@v1
    with:
      service_name: tv-shell-host
      service_description: "the cross-platform host sidecar for tv-shell — a Rust Steam library/launch backend the TV shell's daemon calls over HTTP"
      bump_type: ${{ needs.detect.outputs.bump_type }}
      tag_prefix: host-
      create_release: false
      dry_run: ${{ needs.detect.outputs.dry_run == 'true' }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  build:
    name: ${{ matrix.target }}
    needs: [detect, prepare]
    if: needs.detect.outputs.release == 'true' && needs.detect.outputs.dry_run != 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: tv-shell-host-x86_64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: tv-shell-host-aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: tv-shell-host-x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: tv-shell-host-x86_64-pc-windows-msvc.exe
    steps:
      # The tag the reusable just created is the source of truth for the released
      # version — build from it, never from the branch head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}

      # musl static link needs the musl gcc wrapper; the pure-Rust host needs no
      # other system deps on any target (incl. the cross-arch darwin leg).
      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: .
          key: release-host-${{ matrix.target }}

      # `CARGO_PKG_VERSION` is what `GET /status`, the MQTT state payload, and the
      # HA `host_version` diagnostic entity report. The in-repo manifest only
      # tracks the last released tag, so write the tag being built into
      # host/Cargo.toml BEFORE cargo reads it — otherwise every release reports the
      # in-repo floor forever (it reported `0.1.0` through host-v0.6.0).
      #
      # Stamping the manifest (not a build-time env var) is deliberate: cargo's
      # fingerprint includes the package version, so the rust-cache restore above
      # cannot serve a stale artifact carrying the previous version. It also runs
      # AFTER the cache step so the cache key is computed from the unstamped
      # manifest and stays stable across releases.
      - name: Stamp release version into host/Cargo.toml
        id: stamp
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#host-}"; VERSION="${VERSION#v}"
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::Tag '$TAG' did not yield a semver version (got '$VERSION')"; exit 1 ;;
          esac
          # Rewrites ONLY the `version` key of the `[package]` table: awk tracks
          # the current table header and edits the first matching key while inside
          # `[package]`. A dependency's version (`foo = { version = "1" }`) lives
          # in another table AND is not a line-leading `version` key, so neither
          # gate can reach it. A manifest with no `[package] version` exits 3
          # rather than silently no-op'ing. Records are compared with the trailing
          # CR stripped (and re-emitted) so the Windows leg — where the runner's
          # `core.autocrlf=true` checks the manifest out with CRLF — matches the
          # `[package]` header instead of failing every host release.
          awk -v ver="$VERSION" '
            { line = $0; cr = sub(/\r$/, "", line) ? "\r" : "" }
            /^\[/ { pkg = (line == "[package]") }
            pkg && !stamped && line ~ /^version[ \t]*=/ {
              print "version = \"" ver "\"" cr; stamped = 1; next
            }
            { print }
            END { if (!stamped) exit 3 }
          ' host/Cargo.toml > host/Cargo.toml.stamped
          mv host/Cargo.toml.stamped host/Cargo.toml
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Stamped host/Cargo.toml -> $VERSION"

      # A stamp that silently no-ops is the bug this change exists to delete, so
      # read the version back through cargo's own manifest parser (NOT `cargo
      # pkgid`, which answers from the stale Cargo.lock) and fail the job on a
      # mismatch. Also assert no OTHER crate's manifest moved — a host release
      # must never restamp the daemon.
      - name: Verify the stamp landed
        shell: bash
        env:
          EXPECTED: ${{ steps.stamp.outputs.version }}
        run: |
          set -euo pipefail
          ACTUAL=$(cargo read-manifest --manifest-path host/Cargo.toml | jq -r .version)
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::host/Cargo.toml reports version '$ACTUAL', expected '$EXPECTED' — the stamp did not land"
            exit 1
          fi
          # Assigned first (not piped inside `if`) so a git failure aborts under
          # `set -e` instead of yielding empty output that passes the guard.
          CHANGED=$(git diff --name-only -- '*Cargo.toml')
          # SUBSET check, not equality: the read-back above already proved this
          # crate's version is right, so all this guard owes us is "no OTHER
          # manifest moved". Demanding exact equality also failed when the stamp
          # was a legitimate no-op — a dispatch re-run of an already-released
          # version, or a PR that hand-bumped the floor while carrying a
          # `semver:*` label — leaving CHANGED empty and killing a correct job.
          # `grep -v` exits 1 when nothing survives the filter, which is the
          # SUCCESS case here, so `|| true` keeps `set -o pipefail` from aborting.
          OTHERS=$(printf '%s\n' "$CHANGED" | grep -v -e '^host/Cargo\.toml$' -e '^$' || true)
          if [ -n "$OTHERS" ]; then
            echo "::error::A host release must not modify any other crate's manifest; also changed: $(echo "$OTHERS" | tr '\n' ' ')"
            exit 1
          fi
          echo "OK: tv-shell-host $ACTUAL (no other crate's manifest changed)"

      # No `--locked`: the stamped version makes Cargo.lock's entry for this
      # package stale by design, and cargo refreshes it in place.
      - name: Build
        run: cargo build --release -p tv-shell-host --target ${{ matrix.target }}

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            cp "target/${{ matrix.target }}/release/tv-shell-host.exe" "dist/${{ matrix.asset }}"
          else
            cp "target/${{ matrix.target }}/release/tv-shell-host" "dist/${{ matrix.asset }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish Release
    needs: [detect, prepare, build]
    if: needs.detect.outputs.release == 'true' && needs.detect.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true

      # sha256 over the staged binaries; the Ansible role pins the musl line from
      # this file to verify the fetched artifact before installing it as root.
      - name: Generate checksums
        working-directory: dist
        run: sha256sum tv-shell-host-* | tee checksums.txt

      # The reusable base64-encodes the body so it survives GitHub Actions' job
      # output character restrictions — decode before handing it to the release.
      - name: Decode release notes
        env:
          RELEASE_BODY: ${{ needs.prepare.outputs.release_body }}
        run: printf '%s' "$RELEASE_BODY" | base64 -d > body.md

      - name: Publish release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          body_path: body.md
          files: dist/*
          fail_on_unmatched_files: true

      - name: Summary
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          BUMP: ${{ needs.detect.outputs.bump_type }}
        run: |
          VERSION="${TAG#host-}"; VERSION="${VERSION#v}"
          {
            echo "## Release Host"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Tag | \`${TAG}\` |"
            echo "| Bump | ${BUMP} |"
            echo "| CARGO_PKG_VERSION | \`${VERSION}\` (stamped into host/Cargo.toml) |"
            echo "| Artifacts | 4 binaries + checksums.txt |"
            echo
            echo "[View release](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG})"
          } >> "$GITHUB_STEP_SUMMARY"
