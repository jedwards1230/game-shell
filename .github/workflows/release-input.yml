# Per-binary release workflow for the input daemon (daemon/).
#
# Opt-in via a `semver:input:*` label on the merged PR (or a manual
# `workflow_dispatch`). Version compute, tagging, and AI release notes are
# delegated to the shared `ai-release.yml@v1` reusable; this workflow then builds
# `tv-shell-input` with the canonical deploy feature set (`cec,mcp`) and publishes
# a GitHub Release at the tag with the Linux binary + `checksums.txt`.
#
# The build mirrors the `cec` leg of rust.yml exactly: it runs on `rust:1-trixie`
# (glibc 2.41) because the prebuilt static libcec.a references glibc ≥2.38 C23
# symbols, and that matches the CachyOS deploy target's glibc. The static-libcec
# acceptance gate (no system libcec/libp8-platform link) is re-asserted here so a
# regressed bundling never ships in a release.
#
# Tag scheme (see CLAUDE.md › CI): `host-v*` releases the cross-platform host;
# `input-v*` releases this Linux daemon. The two artifacts are versioned
# independently within the one monorepo — the reusable is called with
# `tag_prefix: input-`, so it only ever reads and writes `input-v*` tags and the
# next version is computed from the `input-v*` series alone.
#
# The release job STAMPS the computed tag version into `daemon/Cargo.toml` before
# `cargo build`, so the released binary's `CARGO_PKG_VERSION` is the real release
# version rather than the in-repo floor, and verifies the stamp landed.
#
# NOTE: releases are no longer cut by pushing an `input-v*` tag by hand. Merge a PR
# labelled `semver:input:patch|minor|major`, or run this workflow manually.

name: Release Input

run-name: >-
  ${{
    github.event_name == 'workflow_dispatch'
      && format('Release Input: {0}{1}', inputs.dry_run && 'dry-run ' || '', inputs.bump_type)
      || format('Release Input: {0}', github.event.head_commit.message || github.sha)
  }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump type"
        required: true
        type: choice
        options: [patch, minor, major]
        default: patch
      dry_run:
        description: "Compute version + preview notes without tagging or publishing"
        required: false
        type: boolean
        default: false

concurrency:
  group: release-input
  cancel-in-progress: false

# ai-release.yml@v1 reads merged PRs for the changelog and the detect job runs
# `gh pr list` — both need pull-requests:read. A restricted permissions block
# defaults every unlisted scope to none, so grant it explicitly.
permissions:
  contents: write
  pull-requests: read

jobs:
  detect:
    name: Detect bump type
    runs-on: ubuntu-latest
    outputs:
      bump_type: ${{ steps.bump.outputs.type }}
      release: ${{ steps.bump.outputs.release }}
      dry_run: ${{ steps.bump.outputs.dry_run }}
    steps:
      - name: Determine bump type
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TYPE="${{ inputs.bump_type }}"; RELEASE="true"; DRY="${{ inputs.dry_run }}"
          else
            # push event: opt-in via the merged PR's semver:input:* label. The label is
            # component-scoped because this monorepo versions host and input
            # independently — a `semver:host:*` label must not cut a daemon release.
            # No matching label -> no release.
            # Retry -- the GitHub API may not have the merge commit indexed yet.
            LABELS=""
            for attempt in 1 2 3; do
              LABELS=$(gh pr list --state merged --base main --limit 100 \
                --json labels,mergeCommit \
                | jq -r --arg sha "$GITHUB_SHA" \
                  '.[] | select(.mergeCommit.oid == $sha) | .labels[].name' 2>/dev/null || echo "")
              [ -n "$LABELS" ] && break
              echo "Attempt ${attempt}: no labels for ${GITHUB_SHA}, retrying in 5s..."
              sleep 5
            done
            echo "Labels: ${LABELS:-<none>}"
            DRY="false"
            if echo "$LABELS" | grep -q 'semver:input:major'; then
              TYPE="major"; RELEASE="true"
            elif echo "$LABELS" | grep -q 'semver:input:minor'; then
              TYPE="minor"; RELEASE="true"
            elif echo "$LABELS" | grep -q 'semver:input:patch'; then
              TYPE="patch"; RELEASE="true"
            else
              echo "::notice::No semver:input:* label -- skipping daemon release."
              TYPE="none"; RELEASE="false"
            fi
          fi
          { echo "type=$TYPE"; echo "release=$RELEASE"; echo "dry_run=$DRY"; } >> "$GITHUB_OUTPUT"

  prepare:
    name: Tag & Generate Notes
    needs: [detect]
    if: needs.detect.outputs.release == 'true'
    uses: jedwards1230/release-workflows/.github/workflows/ai-release.yml@v1
    with:
      service_name: tv-shell-input
      service_description: "the Rust input/AV daemon for tv-shell — owns the gamepad fleet, HDMI-CEC, and the shell's IPC/HTTP/MCP control surface"
      bump_type: ${{ needs.detect.outputs.bump_type }}
      tag_prefix: input-
      create_release: false
      dry_run: ${{ needs.detect.outputs.dry_run == 'true' }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  release:
    name: Build & Publish Release
    needs: [detect, prepare]
    if: needs.detect.outputs.release == 'true' && needs.detect.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    container: rust:1-trixie
    permissions:
      contents: write
    steps:
      # The tag the reusable just created is the source of truth for the released
      # version — build from it, never from the branch head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      # Static libcec (#179) downloads a prebuilt archive (no cmake/libclang); it
      # only needs the udev dev symlink + pkg-config for the link hint, plus
      # libdbus for bluer. Same deps as the rust.yml cec leg.
      #
      # `jq` is NOT a build dep — it is for the "Verify the stamp landed" step
      # below. This job runs in the `rust:1-trixie` container, which ships no
      # jq, while release-host.yml's build jobs run on GitHub runners where jq
      # is preinstalled. That difference is why the identical verify step passed
      # for host-v0.7.0 and killed input-v0.3.0 with `jq: command not found`
      # (exit 127) — after the tag had already been pushed, leaving a tag with
      # no release behind it.
      - name: Install CEC + D-Bus build deps (+ jq for the stamp check)
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            libudev-dev libdbus-1-dev pkg-config jq

      - name: Cache cargo
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: .
          key: release-input

      # `CARGO_PKG_VERSION` is what the `build-info` IPC reply, `GET /dev/status`,
      # the MQTT `ShellSnapshot`, the HA `daemon_version` diagnostic entity, and
      # the MCP server version report. The in-repo manifest only tracks the last
      # released tag, so write the tag being built into daemon/Cargo.toml BEFORE
      # cargo reads it — otherwise every release reports the in-repo floor forever
      # (it reported `0.1.0` through input-v0.2.2).
      #
      # Stamping the manifest (not a build-time env var) is deliberate: cargo's
      # fingerprint includes the package version, so the rust-cache restore above
      # cannot serve a stale artifact carrying the previous version. It also runs
      # AFTER the cache step so the cache key is computed from the unstamped
      # manifest and stays stable across releases.
      - name: Stamp release version into daemon/Cargo.toml
        id: stamp
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#input-}"; VERSION="${VERSION#v}"
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::Tag '$TAG' did not yield a semver version (got '$VERSION')"; exit 1 ;;
          esac
          # Fingerprint every manifest BEFORE the stamp so the verify step can
          # prove which ones moved without asking git. This job runs in the
          # `rust:1-trixie` container, which ships no git — so actions/checkout
          # falls back to a REST-API tarball and there is no `.git` at all. The
          # previous `git diff --name-only` guard therefore ran outside a work
          # tree, where git implies `--no-index`, demands two paths, and exits
          # 129. Hashing is not a workaround for that: it measures the property
          # the guard actually claims ("no other manifest changed") directly,
          # instead of inferring it from VCS state that happens to be present.
          find . -name Cargo.toml -not -path './target/*' -print0 \
            | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/manifests.before"
          # Rewrites ONLY the `version` key of the `[package]` table: awk tracks
          # the current table header and edits the first matching key while inside
          # `[package]`. A dependency's version (`foo = { version = "1" }`) lives
          # in another table AND is not a line-leading `version` key, so neither
          # gate can reach it. A manifest with no `[package] version` exits 3
          # rather than silently no-op'ing. Records are compared with the trailing
          # CR stripped (and re-emitted) so a CRLF checkout still matches the
          # `[package]` header — kept identical to release-host.yml's step, where
          # the Windows runner's `core.autocrlf=true` makes that case real.
          awk -v ver="$VERSION" '
            { line = $0; cr = sub(/\r$/, "", line) ? "\r" : "" }
            /^\[/ { pkg = (line == "[package]") }
            pkg && !stamped && line ~ /^version[ \t]*=/ {
              print "version = \"" ver "\"" cr; stamped = 1; next
            }
            { print }
            END { if (!stamped) exit 3 }
          ' daemon/Cargo.toml > daemon/Cargo.toml.stamped
          mv daemon/Cargo.toml.stamped daemon/Cargo.toml
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Stamped daemon/Cargo.toml -> $VERSION"

      # A stamp that silently no-ops is the bug this change exists to delete, so
      # read the version back through cargo's own manifest parser (NOT `cargo
      # pkgid`, which answers from the stale Cargo.lock) and fail the job on a
      # mismatch. Also assert no OTHER crate's manifest moved — a daemon release
      # must never restamp the host.
      - name: Verify the stamp landed
        shell: bash
        env:
          EXPECTED: ${{ steps.stamp.outputs.version }}
        run: |
          set -euo pipefail
          ACTUAL=$(cargo read-manifest --manifest-path daemon/Cargo.toml | jq -r .version)
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::daemon/Cargo.toml reports version '$ACTUAL', expected '$EXPECTED' — the stamp did not land"
            exit 1
          fi
          # Re-fingerprint and compare against the pre-stamp snapshot. Assigned
          # first (not piped inside `if`) so a failure aborts under `set -e`
          # instead of yielding empty output that passes the guard.
          #
          # The `.before` file must exist — if the stamp step did not run, an
          # absent snapshot would otherwise make `diff` fail in a way that could
          # read as "nothing changed".
          test -f "$RUNNER_TEMP/manifests.before" \
            || { echo "::error::pre-stamp manifest snapshot missing — the stamp step did not run"; exit 1; }
          find . -name Cargo.toml -not -path './target/*' -print0 \
            | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/manifests.after"
          # SUBSET check, not equality: the read-back above already proved this
          # crate's version is right, so all this guard owes us is "no OTHER
          # manifest moved". Demanding exact equality also failed when the stamp
          # was a legitimate no-op — a dispatch re-run of an already-released
          # version, or a PR that hand-bumped the floor while carrying a
          # `semver:*` label — leaving the change set empty and killing a correct
          # job. `grep -v` exits 1 when nothing survives the filter, which is the
          # SUCCESS case here, so `|| true` keeps `set -o pipefail` from aborting.
          CHANGED=$(diff "$RUNNER_TEMP/manifests.before" "$RUNNER_TEMP/manifests.after" \
            | sed -n 's/^[<>] [0-9a-f]\{64\}  //p' | sort -u || true)
          OTHERS=$(printf '%s\n' "$CHANGED" | grep -v -e '^\./daemon/Cargo\.toml$' -e '^$' || true)
          if [ -n "$OTHERS" ]; then
            echo "::error::A daemon release must not modify any other crate's manifest; also changed: $(echo "$OTHERS" | tr '\n' ' ')"
            exit 1
          fi
          echo "OK: tv-shell-input $ACTUAL (no other crate's manifest changed)"

      # No `--locked`: the stamped version makes Cargo.lock's entry for this
      # package stale by design, and cargo refreshes it in place.
      - name: Build (--features cec,mcp)
        run: cargo build --release -p tv-shell-input --features cec,mcp

      - name: Stage binary
        run: |
          mkdir -p dist
          cp target/release/tv-shell-input dist/tv-shell-input-x86_64-unknown-linux-gnu

      # Acceptance gate (#179): the static build must NOT dynamically link the
      # system libcec / libp8-platform — those are bundled into the binary. Read
      # the STAGED artifact so the gate verifies exactly what gets released.
      - name: Assert no system libcec dependency
        run: |
          BIN=dist/tv-shell-input-x86_64-unknown-linux-gnu
          echo "ldd $BIN:"
          ldd "$BIN" || true
          if ldd "$BIN" | grep -Eiq 'libcec|libp8-platform'; then
            echo "::error::tv-shell-input dynamically links system libcec/libp8-platform — static bundling (#179) regressed"
            exit 1
          fi
          echo "OK: no system libcec/libp8-platform dynamic dependency"

      - name: Generate checksums
        working-directory: dist
        run: sha256sum tv-shell-input-* | tee checksums.txt

      # The reusable base64-encodes the body so it survives GitHub Actions' job
      # output character restrictions — decode before handing it to the release.
      - name: Decode release notes
        env:
          RELEASE_BODY: ${{ needs.prepare.outputs.release_body }}
        run: printf '%s' "$RELEASE_BODY" | base64 -d > body.md

      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          body_path: body.md
          files: dist/*
          fail_on_unmatched_files: true

      - name: Summary
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          BUMP: ${{ needs.detect.outputs.bump_type }}
          VERSION: ${{ steps.stamp.outputs.version }}
        run: |
          {
            echo "## Release Input"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Tag | \`${TAG}\` |"
            echo "| Bump | ${BUMP} |"
            echo "| CARGO_PKG_VERSION | \`${VERSION}\` (stamped into daemon/Cargo.toml) |"
            echo "| Artifacts | tv-shell-input (linux-gnu) + checksums.txt |"
            echo
            echo "[View release](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG})"
          } >> "$GITHUB_STEP_SUMMARY"
