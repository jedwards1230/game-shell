# QML quality gates — two independent jobs, both on Qt 6.8:
#   qml-format  — qmlformat. On PRs it auto-formats and pushes a fix commit; on
#                 main it fails if anything is unformatted.
#   qml-lint    — qmllint. Catches QML that PARSES but fails to LOAD (duplicate
#                 signal/property, bad signal-handler name, alias/inheritance
#                 cycle) — the class qmlformat is blind to. Severities are driven
#                 by the repo-root .qmllint.ini (see that file for the rationale:
#                 resolution-dependent categories are demoted to info/disable
#                 because stock qmllint can't resolve the Quickshell modules).
#
# Invoked by the CI orchestrator (.github/workflows/ci.yml), which decides via
# path-based change detection whether any .qml (or .qmllint.ini) changed. ci.yml
# passes the write permission + secrets the auto-format push needs; qml-lint
# narrows itself back to read-only. ci.yml is the single required-check surface.

name: Lint

on:
  workflow_call:

permissions:
  contents: write

jobs:
  qml-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.head_ref }}

      - name: Install Qt 6.8.3
        # NOT jurplel/install-qt-action. This repo enforces `sha_pinning_required`
        # on Actions, and that check applies to TRANSITIVE action references: the
        # action's own composite calls `actions/setup-python@v6` and
        # `jurplel/install-qt-action/action@v4` unpinned, so pinning our own
        # `uses:` to a SHA is not sufficient and every QML job was rejected before
        # running a single step:
        #
        #   The actions actions/setup-python@v6 and jurplel/install-qt-action/action@v4
        #   are not allowed in jedwards1230/tv-shell because all actions must be
        #   pinned to a full-length commit SHA.
        #
        # With `allowed_actions: all` there is no allow-list/exemption to grant
        # (the selected-actions API 409s), so the action is simply unusable here.
        # Installing Qt through plain `run:` steps sidesteps the policy entirely —
        # no action is involved, nothing to pin — while keeping the EXACT Qt
        # version the gates are calibrated to (.qmllint.ini severities + qmlformat
        # output both drift between Qt releases, so this must not float to
        # whatever apt ships).
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libglib2.0-0t64 libgl1 libegl1 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libfontconfig1 libfreetype6 libgssapi-krb5-2 \
            libharfbuzz0b libpng16-16 libmd4c0
          python3 -m pip install --break-system-packages --quiet 'aqtinstall==3.2.1'
          aqt install-qt linux desktop "$QT_VERSION" linux_gcc_64 \
            --outputdir "$RUNNER_TEMP/Qt"
          echo "$RUNNER_TEMP/Qt/$QT_VERSION/gcc_64/bin" >> "$GITHUB_PATH"
        env:
          QT_VERSION: "6.8.3"

      - name: Format QML files
        run: |
          find . -name '*.qml' -not -path './worktrees/*' -not -path './.git/*' \
            -exec qmlformat -i {} +

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- '*.qml'; then
            echo "formatted=false" >> "$GITHUB_OUTPUT"
          else
            echo "formatted=true" >> "$GITHUB_OUTPUT"
            echo "::warning::qmlformat modified files — pushing auto-format commit"
            git diff --stat -- '*.qml'
          fi

      - name: Push formatted files
        if: steps.diff.outputs.formatted == 'true' && github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore --staged . 2>/dev/null || true
          git add -- '*.qml'
          git commit -m "style: auto-format QML files"
          git push

      - name: Fail on main if unformatted
        if: steps.diff.outputs.formatted == 'true' && github.event_name == 'push'
        run: |
          echo "::error::QML files are not formatted. Run qmlformat -i on all .qml files."
          exit 1

  qml-lint:
    # Read-only: the auto-format push is the other job's concern.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Qt 6.8.3
        # NOT jurplel/install-qt-action. This repo enforces `sha_pinning_required`
        # on Actions, and that check applies to TRANSITIVE action references: the
        # action's own composite calls `actions/setup-python@v6` and
        # `jurplel/install-qt-action/action@v4` unpinned, so pinning our own
        # `uses:` to a SHA is not sufficient and every QML job was rejected before
        # running a single step:
        #
        #   The actions actions/setup-python@v6 and jurplel/install-qt-action/action@v4
        #   are not allowed in jedwards1230/tv-shell because all actions must be
        #   pinned to a full-length commit SHA.
        #
        # With `allowed_actions: all` there is no allow-list/exemption to grant
        # (the selected-actions API 409s), so the action is simply unusable here.
        # Installing Qt through plain `run:` steps sidesteps the policy entirely —
        # no action is involved, nothing to pin — while keeping the EXACT Qt
        # version the gates are calibrated to (.qmllint.ini severities + qmlformat
        # output both drift between Qt releases, so this must not float to
        # whatever apt ships).
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libglib2.0-0t64 libgl1 libegl1 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libfontconfig1 libfreetype6 libgssapi-krb5-2 \
            libharfbuzz0b libpng16-16 libmd4c0
          python3 -m pip install --break-system-packages --quiet 'aqtinstall==3.2.1'
          aqt install-qt linux desktop "$QT_VERSION" linux_gcc_64 \
            --outputdir "$RUNNER_TEMP/Qt"
          echo "$RUNNER_TEMP/Qt/$QT_VERSION/gcc_64/bin" >> "$GITHUB_PATH"
        env:
          QT_VERSION: "6.8.3"

      - name: Lint QML (load-time defects)
        run: |
          # qmllint auto-discovers the repo-root .qmllint.ini (searches upward
          # from each file). Severities there gate the run via MaxWarnings=0: a
          # warning-level (structural) category fails the job; info is visible but
          # non-fatal. `-D Quick` disables the QtQuick best-practice plugin — its
          # Quick.* categories are stylistic UB hints (not the load-failure class
          # we gate on) whose ini key names differ across Qt versions, so they
          # can't be demoted portably; disabling the plugin is the version-robust
          # way to keep them out of the gate. Lint every shell QML file in one
          # invocation so the exit code aggregates across the tree.
          mapfile -d '' files < <(find shell -name '*.qml' -print0)
          echo "Linting ${#files[@]} QML files with qmllint $(qmllint --version | head -1)"
          qmllint -D Quick "${files[@]}"

      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## qmllint"
            echo ""
            echo "Gate for QML that parses but won't load (duplicate signal/property,"
            echo "bad signal-handler name, alias/inheritance cycle) — the class qmlformat"
            echo "is blind to. Severities come from the repo-root .qmllint.ini."
            echo ""
            echo "Result: **${JOB_STATUS}**."
          } >> "$GITHUB_STEP_SUMMARY"
