[package]
name = "tv-shell-panel"
# 0.0.0 on purpose: no `panel-v*` release stream exists (the panel is built from
# source on-device) and nothing reads its `CARGO_PKG_VERSION`. If a stream is
# ever added, give it the host/daemon treatment — a release workflow that stamps
# the tag here — rather than hand-maintaining a number nothing verifies.
version = "0.0.0"
edition.workspace = true
# Not inherited from the workspace (1.75): axum/reqwest/askama transitives pull
# edition2024 crates that require Cargo >=1.85, exactly like the host crate.
rust-version = "1.85"
license.workspace = true
description = "LAN-only, server-rendered web control panel for the tv-shell HTPC daemon"

[[bin]]
name = "tv-shell-panel"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { workspace = true }
tv-shell-protocol = { workspace = true }
askama = { workspace = true }
# Constant-time credential comparison for the panel's own auth (same crate and
# same `ConstantTimeEq` usage as the daemon's `bridge_core::ct_eq_str`).
subtle = { workspace = true }
# Typed config parsing (~/.config/tv-shell/config.toml), matching how the
# daemon declares it directly rather than via a workspace dep.
toml = "1.1"
# Format/comment-preserving config.toml edits — the panel's only config write
# is the CEC page's single-key `[cec].osd_name` update; everything else in the
# operator's file (comments, ordering, unknown sections) must survive intact.
toml_edit = "0.25"

[dev-dependencies]
# `#[tokio::test(start_paused = true)]` for the capability handshake's bounded
# retry window: its worst case is ~9s of real sleeping, which a test must not
# actually spend. Dev-dependencies ARE resolved (they are in the graph and the
# lockfile); what keeps `test-util` out of the release binary is the workspace's
# `resolver = "2"`, which stops dev-only features being unified into a normal
# `cargo build`. Pure Rust, no C.
tokio = { workspace = true, features = ["test-util"] }

# uid lookup for the $XDG_RUNTIME_DIR-unset socket-path fallback (matches how
# the host crate uses libc on Linux for its own OS-level needs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"
