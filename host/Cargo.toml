[package]
name = "tv-shell-host"
version = "0.1.0"
edition.workspace = true
# Not inherited from the workspace (1.75): the host's dep closure (axum/reqwest
# transitives) pulls edition2024 crates that require Cargo >=1.85.
rust-version = "1.85"
license.workspace = true
description = "Cross-platform tv-shell host sidecar: enumerates installed Steam games and launches them via steam://rungameid"

[[bin]]
name = "tv-shell-host"
path = "src/main.rs"

[dependencies]
# Pure-Rust, cross-platform graph only — no evdev/cec/zbus. This is the host's
# whole reason to be a separate crate: it builds clean on Windows/macOS.
tokio = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# Constant-time bearer-token compare (same policy as the daemon's HTTP bridge).
subtle = { workspace = true }
# Pure-Rust Valve KeyValues (VDF/ACF) parser for libraryfolders.vdf +
# appmanifest_*.acf.
keyvalues-parser = { workspace = true }
# MQTT client. `default-features = false` + `use-rustls-no-provider` is
# load-bearing, not tidiness: rumqttc's DEFAULT feature (`use-rustls`) enables
# `tokio-rustls/default`, whose crypto provider is `aws-lc-rs` — C + cmake, which
# would break this crate's whole reason to exist (a pure-Rust graph that
# cross-compiles clean on Windows and macOS). NEVER `use-native-tls` either: that
# drags in the system C TLS stack. The provider is supplied explicitly below.
rumqttc = { version = "0.25", default-features = false, features = ["use-rustls-no-provider"] }
# The crypto provider for the above, pinned to `ring` — the same provider the
# workspace already resolves via reqwest's `rustls-tls`, so there is exactly one
# in the graph and still no `aws-lc-rs`. Installed once at startup by
# `mqtt::install_crypto_provider`.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tv-shell-protocol = { workspace = true }

# POSIX kill(2) for the graceful-quit path (SIGTERM to the running game's process
# group). Only needed on Linux; gating it here keeps the macOS/Windows graph
# unchanged. (libc itself compiles cross-platform, but it's unused off Linux.)
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
